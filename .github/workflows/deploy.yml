name: CI/CD Pipeline - MPCG Payroll

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # -------------------------------------------------------------
  # Job 1: CI (Continuous Integration - Validate & Build Check)
  # -------------------------------------------------------------
  build-and-test:
    name: Build & Validate Code
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./mpcg-payroll

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./mpcg-payroll/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build Next.js Application
        env:
          NEXTAUTH_SECRET: "ci-test-secret-key-32-bytes-long-min"
          AUTH_SECRET: "ci-test-secret-key-32-bytes-long-min"
          DATABASE_URL: "mysql://ci_user:ci_pass@127.0.0.1:3306/mpcg_payroll"
        run: npm run build

  # -------------------------------------------------------------
  # Job 2: CD (Continuous Deployment - Auto Deploy to AWS EC2)
  # -------------------------------------------------------------
  deploy-to-ec2:
    name: Deploy to EC2 Production
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Execute Remote SSH Commands on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script_stop: true
          script: |
            # Load environment paths (NVM, PM2, Node)
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PATH=$PATH:/usr/local/bin:/usr/bin

            echo "=== 1. Navigating to project directory ==="
            cd ~/salary-code/mpcg-payroll

            echo "=== 2. Pulling latest code from main ==="
            git pull origin main

            echo "=== 3. Installing dependencies ==="
            npm install --production=false

            echo "=== 4. Updating Prisma schema ==="
            npx prisma generate
            npx prisma db push

            echo "=== 5. Building Next.js application ==="
            npm run build

            echo "=== 6. Restarting PM2 process ==="
            pm2 restart mpcg-payroll

            echo "=== Deployment Completed Successfully! ==="
